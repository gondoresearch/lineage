services:
  lineage:
    build: .
    # One image per lineage version (built from this checkout); older ones stay available to go back to.
    image: lineage:0.3.3
    # Run as your own user so files in ./data stay yours (set LINEAGE_UID/LINEAGE_GID if `id -u`/`id -g` are not 1000).
    user: "${LINEAGE_UID:-1000}:${LINEAGE_GID:-1000}"
    environment:
      DATA_DIR: /data
      # On the first start two showcase accounts are created with the example data: "demo"
      # (password "demo") and "lineage" (password "lineage"). Set to "0" to skip them; change or
      # delete them before exposing lineage (see the README).
      LINEAGE_DEMO: "${LINEAGE_DEMO:-1}"
      # Set to "1" when lineage is served over HTTPS, so the login cookie is only sent over HTTPS.
      LINEAGE_SECURE_COOKIE: "${LINEAGE_SECURE_COOKIE:-0}"
    volumes:
      - ./data:/data
    ports:
      # Published on this machine only (http://localhost:8080). lineage has logins, but it
      # speaks plain HTTP: passwords and session cookies would cross the network unencrypted.
      #
      # To reach it from other machines, put it behind a reverse proxy that does HTTPS (Caddy,
      # nginx, Traefik…) and set LINEAGE_SECURE_COOKIE=1. If that proxy runs on this same
      # machine, keep the line below and point the proxy at http://127.0.0.1:8080; otherwise
      # use "8080:8000".
      - "127.0.0.1:8080:8000"
    restart: unless-stopped
