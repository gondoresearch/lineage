[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage"
version = "0.3.0"
license = "CC-BY-SA-4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2>=2.16"]

[tool.setuptools]
package-dir = { "backend" = "." }
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
